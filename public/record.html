<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記録 - 教育支援キャラクター育成</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/record.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/record.css">
</head>


<body class="app-with-footer">
  <header class="app-header">記録</header>
  <main class="main-content record-page">
    <div class="record-inner">
      <div class="fixed inset-0 paper-texture record-paper" aria-hidden="true"></div>

      <div class="record-body">
        <section class="card profile">
          <div class="washi-tape tape-top-left"></div>

          <!-- アイコン(画像) -->
          <div class="profile-header">
            <div class="char-icon-container">
              <div class="char-icon-circle">
                <img src="img/shake.png" alt="キャラクターアイコン" class="char-icon-img">
              </div>
            </div>

            <div class="status-container">
              <!-- レベル -->
              <div class="level-badge">
                <span class="level-label">LEVEL</span>
                <span class="level-value" id="level-value">-</span>
              </div>
              <!-- ランク -->
              <div class="rank-badge">
                <span class="material-symbols-outlined rank-icon">workspace_premium</span>
                <div class="rank-info">
                  <span class="rank-label">らんく</span>
                  <span class="rank-value">しるばー</span>
                </div>
              </div>
              <!-- 称号 -->
              <div class="title-badge">
                <span class="material-symbols-outlined title-icon">military_tech</span>
                <div class="title-info">
                  <span class="title-label">しょうごう</span><br>
                  <span class="title-value">べんきょうマスター</span>
                </div>
              </div>
            </div>
          </div>

          <div class="prompt-box">
            <div class="prompt-arrow"></div>
            <!-- AIによる学習継続のプロンプト -->
            <p class="study-prompt">
              ５にちれんぞくやで！すご！！
            </p>
          </div>
          <!-- 学習時間のプログレスバー -->
          <div class="exp-container">
            <div class="exp-info">
              <span>つぎのレベルまで</span>
              <span id="next-level-remaining">あと 120 ふん</span>
            </div>
            <div class="exp-bar-track">
              <div class="exp-bar-fill" id="exp-bar-fill" style="width: 65%;">
                <div class="exp-bar-stripe"></div>
              </div>
            </div>
          </div>
        </section>

        <div class="stats-summary-container">
  <div class="stats-sticky sticky-yellow">
    <span class="stats-label">こんしゅう</span>
    <div class="stats-value-group">
      <span class="stats-value" id="weekly-minutes">0</span>
      <span class="stats-unit">ふん</span>
    </div>
  </div>

  <div class="stats-sticky sticky-blue">
    <span class="stats-label">れんぞく</span>
    <div class="stats-value-group">
      <span class="stats-value" id="login-streak">5</span>
      <span class="stats-unit">にち</span>
    </div>
  </div>
</div>

        <section class="card today-record-card">
          <div class="push-pin"></div>

  <h2 class="menu-title">
    <span class="material-symbols-outlined">edit_square</span>
    とうろく
  </h2>

  <div class="category-grid">
    <button class="category-item btn-timer" type="button" onclick="location.href='record-timer.html'">
      <div class="icon-circle">
        <span class="material-symbols-outlined">timer</span>
      </div>
      <span class="category-label">タイマー</span>
    </button>

    <button class="category-item btn-manual" type="button" onclick="location.href='record-manual.html'">
      <div class="icon-circle">
        <span class="material-symbols-outlined">edit_note</span>
      </div>
      <span class="category-label">しゅどう</span>
    </button>

    <button class="category-item btn-score" type="button" onclick="location.href='record-score.html'">
      <div class="icon-circle">
        <span class="material-symbols-outlined">stars</span>
      </div>
      <span class="category-label">てんすう</span>
    </button>
  </div>
</section>

          <section class="card view-section connecting-double-ropes">
  
  <button class="view-content-wrapper" type="button" onclick="location.href='records.html'">
    <div class="view-info">
      <h2 class="menu-title">
        <span class="material-symbols-outlined">visibility</span>
        えつらん
      </h2>
      <p class="view-desc">これまでの きろくを みてみよう！</p>
    </div>
    
    <div class="view-arrow">
      <span class="material-symbols-outlined">chevron_right</span>
    </div>
  </button>
</section>
        </div>

        <section class="bg-surface-container-low p-6 rounded-xl border-2 border-outline-variant/30 relative">
          <div class="absolute -top-4 right-8 washi-tape rotate-6 bg-tertiary-fixed/60"></div>
          <h3 class="font-bold text-on-surface-variant flex items-center gap-2 mb-4">
            <span class="material-symbols-outlined text-primary text-sm">stars</span>
            こんしゅうの がんばり
          </h3>
          <div class="flex items-end justify-between h-32 gap-2 px-2 border-b-2 border-outline-variant/40 pb-2">
            <div class="w-full bg-secondary-container rounded-t-lg h-[40%]"></div>
            <div class="w-full bg-secondary-container rounded-t-lg h-[60%]"></div>
            <div class="w-full bg-secondary-container rounded-t-lg h-[30%]"></div>
            <div class="w-full bg-secondary-container rounded-t-lg h-[80%]"></div>
            <div class="w-full bg-primary rounded-t-lg h-[95%]"></div>
            <div class="w-full bg-secondary-container rounded-t-lg h-[20%]"></div>
            <div class="w-full bg-surface-container-highest rounded-t-lg h-[10%]"></div>
          </div>
          <div class="flex justify-between mt-2 text-[10px] text-on-surface-variant font-bold">
            <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- 新種のおにぎりを発見したときに表示される部分 -->
  <div id="new-onigiri-popup" class="popup-overlay">
    <div class="rolling-onigiri">
      <img src="img/base.jpg" alt="転がるおにぎり（レベル1）">
    </div>
    <div class="rolling-bg"></div>

    <div class="popup-center-container">
      <div class="popup-content">
        <button class="popup-close-btn">&times;</button>
        

        <div class="popup-body">
          <div class="popup-animation-group">
            <div class="popup-img-wrap">
              <!-- 画像生成したURLをここに入れる -->
              <img src="img/base.jpg" alt="新登場（レベル1）" class="popup-img">
            </div>
            <!-- new-nameはおにぎりの名前を表示させる部分 -->
            <h2 class="popup-title">新種「<span id="new-name">おにぎり</span>」を<br>発見！</h2>
            <button class="popup-action-btn" id="register-btn">シール手帳に貼る！</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/record-config.js"></script>
  <script src="js/record.js"></script>
</body>

</html>
