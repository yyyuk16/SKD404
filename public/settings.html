<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設定 - 教育支援キャラクター育成</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body class="app-with-footer">
  <header class="app-header">設定</header>

  <main class="main-content">

    <div class="card profile-edit-card">
      <div class="washi-tape tape-top-left"></div>
  <h2 class="menu-title">
    マイプロフィール
  </h2>

  <div class="profile-edit-content">
    <div class="char-icon-container profile-edit-icon">
      <div class="char-icon-circle">
        <img src="img/shake.png" alt="キャラクターアイコン" class="char-icon-img">
      </div>
    </div>

    <dl class="profile-detail" id="profile-detail">
      <div class="detail-item">
        <dt>名前</dt>
        <dd id="disp-name">なまえ</dd>
      </div>
      <div class="detail-item">
        <dt>学年</dt>
        <dd id="disp-grade">大学2年生</dd>
      </div>
      <div class="detail-item">
        <dt>得意教科</dt>
        <dd id="disp-subject">プログラミング</dd>
      </div>
      <div class="detail-item">
        <dt>趣味</dt>
        <dd id="disp-hobby">3Dモデリング</dd>
      </div>
    </dl>
  </div>
</div>

    <div class="card">
      <button type="button" class="btn btn-secondary" id="logout-btn" style="width: 100%;">ログアウト</button>
    </div>
  </main>

  <!-- フッターメニュー -->
  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
