<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設定 - 教育支援キャラクター育成</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">設定</header>
  <main class="main-content">
    <div class="card">
      <h2 style="margin-bottom: 16px;">登録したプロフィール</h2>
      <dl class="profile-detail" id="profile-detail">
        <dt>名前</dt><dd id="disp-name">—</dd>
        <dt>学年</dt><dd id="disp-grade">—</dd>
        <dt>得意教科</dt><dd id="disp-subject">—</dd>
        <dt>趣味</dt><dd id="disp-hobby">—</dd>
      </dl>
    </div>
    <div class="card">
      <button type="button" class="btn btn-secondary" id="logout-btn" style="width: 100%;">ログアウト</button>
    </div>
  </main>
  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
