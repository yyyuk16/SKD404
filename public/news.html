<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/news.css">
    <title>My News Notebook</title>
    
    <link rel="stylesheet" href="news.css"> 
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="news-container">
  <section class="today-news" id="today-news">
      <span class="label">きょうのニュース！</span>
      <h2 id="top-title">読み込み中...</h2>
      <p id="top-desc"></p>
      <button class="btn-read-more">もっとよむ 🚀</button>
      <div class="hero-image" id="top-img"></div>
  </section>

  <section class="interest-categories">
      <h3>★ じぶんのきょうみ <span class="link-all">ぜんぶみる →</span></h3>
      <div class="category-grid">
          <div class="category-item active" data-query="宇宙">
              <div class="icon">🚀</div><span>うちゅう</span>
          </div>
          <div class="category-item" data-query="サッカー">
              <div class="icon">⚽</div><span>サッカー</span>
          </div>
          <div class="category-item" data-query="お絵描き">
              <div class="icon">🎨</div><span>おえかき</span>
          </div>
          <div class="category-item">
              <div class="icon">＋</div><span>ついか</span>
          </div>
      </div>
  </section>

  <section class="wakuwaku-section">
      <h3>✨ わくわくニュース</h3>
      <div id="wakuwaku-list" class="news-list"></div>
  </section>
</main>


  <!-- フッターメニュー -->
  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/news.js"></script>
</body>
</html>
