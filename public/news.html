<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <title>関連ニュース - 教育支援キャラクター育成</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">
  <link rel="stylesheet" href="css/news.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-with-footer">
  <header class="app-header">関連ニュース</header>
  <main class="main-content">
    <div class="card">
      <h2 style="margin-bottom: 8px;">最新のニュース</h2>
      <p style="color: var(--text-muted); margin-bottom: 16px;">教育・学習まわりの最新情報です。</p>
      <ul class="news-list" id="news-list-latest"></ul>
      <p class="news-loading" id="news-latest-loading">読み込み中…</p>
      <p class="news-error" id="news-latest-error" style="display:none;"></p>
    </div>
    <div class="card">
      <h2 style="margin-bottom: 8px;">あなた向けのニュース</h2>
      <p style="color: var(--text-muted); margin-bottom: 16px;">得意教科・趣味に合わせたニュースです。</p>
      <ul class="news-list" id="news-list-personalized"></ul>
      <p class="news-loading" id="news-personalized-loading">読み込み中…</p>
      <p class="news-error" id="news-personalized-error" style="display:none;"></p>
    </div>
  </main>


  <!-- フッターメニュー -->
  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/news.js"></script>
</body>
</html>
