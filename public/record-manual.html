<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー記録 - 教育支援キャラクター育成</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/record-manual.css">
</head>
<body class="app-with-footer">
  <header class="app-header">タイマーで記録</header>
  <main class="main-content timer-page">
    <div style="margin-bottom: 12px; padding-left: 16px;">
      <button type="button" class="btn-back" onclick="location.href='record.html'">
        ← もどる
      </button>
    </div>
    <div class="timer-header-bar">
      <button class="timer-create-btn" type="button">
        ＋ タイマー作成
      </button>
    </div>
    <section class="timer-list-section">
      <h2 class="timer-list-title">保存済みタイマー</h2>
      <ul class="timer-list" id="preset-timer-list"></ul>
    </section>
  </main>
  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/record-manual.js"></script>
</body>
</html>
