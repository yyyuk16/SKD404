<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記録 - 教育支援キャラクター育成</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/timer.css">
</head>

<body app-with-footer>
    <header class="app-header">記録</header>
    <main class="main-content time-page">
        <!-- 上に置くモード変換機能 -->
        <div class="modeSelect">
            <ul>
                <li id="sMode">ストップウォッチ</li>
                <li id="tMode">タイマー</li>
            </ul>
        </div>
        
        <!-- ストップウォッチを選択した際のHTML -->
        <div id="sMode-display">これはストップウォッチモード画面です</div>

        <!-- タイマーを選択した際のHTML -->
        <div id="tMode-display">これはタイマーモード画面です</div>
        
    </main>

    <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/timer.js"></script>
</body>
