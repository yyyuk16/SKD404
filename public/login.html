<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - 教育支援キャラクター育成</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <header class="app-header" style="border-radius: 12px 12px 0 0;">ログイン</header>
    <div class="card" style="border-radius: 0 0 12px 12px;">
      <h1>ようこそ</h1>
      <p style="color: var(--text-muted); margin-bottom: 12px;">メールアドレスとパスワードでログインできます。</p>
      <div id="auth-area" style="margin-bottom: 14px;">
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" placeholder="your@example.com">
        </div>
        <div class="form-group">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" placeholder="6文字以上">
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <button id="email-login-btn" type="button" class="btn btn-secondary">ログイン</button>
          <button id="email-signup-btn" type="button" class="btn btn-secondary">新規登録</button>
        </div>
        <p id="auth-message" style="color: #d32f2f; margin: 0; min-height: 18px; font-size: 0.9em;"></p>
      </div>
      <div style="margin-top: 6px;">
        <button
          id="go-first-login-btn"
          type="button"
          class="btn btn-primary"
          style="display:none; width: 100%;"
          onclick="location.href='login-first.html'">
          初回ログインページへ（プロフィール登録）
        </button>
      </div>
      <p style="color: var(--text-muted); margin-top: 12px; margin-bottom: 0; font-size: 0.9em;">
        初めての方や、プロフィール登録がまだの方はこちらからできます。
      </p>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    $(function () {
      var $authMessage = $("#auth-message");
      var $firstLoginBtn = $("#go-first-login-btn");

      function setAuthMessage(message, isError) {
        $authMessage.text(message);
        $authMessage.css("color", isError ? "#d32f2f" : "#2e7d32");
      }

      function handleAuthError(err) {
        setAuthMessage(err && err.message ? err.message : "認証に失敗しました。", true);
      }

      function handleAfterLogin(userOrUid) {
       var uid = typeof userOrUid === "string" ? userOrUid : (userOrUid && userOrUid.uid);
       $firstLoginBtn.hide();

       if (!uid || !window.EduChar || typeof window.EduChar.getProfile !== "function") {
    return;
  }

        window.EduChar.getProfile(uid, function (profile) {
          if (profile && typeof profile === "object") {
            //window.location.href = "index.html";
            setAuthMessage("ログイン済みです。ホーム画面へ移動できます。", false);
            return;
          }

          setAuthMessage("プロフィールがまだありません。初回ログインページで登録してください。", false);
          $firstLoginBtn.show();
        });
      }

      if (window.firebaseAuth) {
        window.firebaseAuth.onAuthStateChanged(function (user) {
          if (user) {
            setAuthMessage("現在ログイン中: " + (user.email || "ユーザー") + "（UID: " + user.uid + "）", false);
            handleAfterLogin(user);
          } else {
            setAuthMessage("ログインしてください。", false);
          }
        });
      }

      if (window.firebaseAuth && window.firebaseAuth.currentUser) {
        handleAfterLogin(window.firebaseAuth.currentUser);
      }

      $("#email-login-btn").on("click", function () {
        var email = $("#email").val().trim();
        var password = $("#password").val();
        if (!email || !password) {
        setAuthMessage("メールアドレスとパスワードを入力してください。", true);
        return;
       }
       signInWithEmailPassword(email, password, function () {
       setAuthMessage("ログインに成功しました。移動します...", false);
       window.location.href = "index.html"; 
       }, handleAuthError);
      });

      $("#email-signup-btn").on("click", function () {
        var email = $("#email").val().trim();
        var password = $("#password").val();
        if (!email || !password) {
          setAuthMessage("メールアドレスとパスワードを入力してください。", true);
          return;
        }
        if (password.length < 6) {
          setAuthMessage("パスワードは6文字以上である必要があります。", true);
          return;
        }
        createUserWithEmailPassword(email, password, function () {
          setAuthMessage("新規登録に成功しました。", false);
        }, handleAuthError);
      });

      // 2回目以降用のログイン画面では匿名サインインは行いません。
      // プロフィール未登録の場合は「初回ログインページへ」へ誘導します。
    });
  </script>
</body>
</html>
