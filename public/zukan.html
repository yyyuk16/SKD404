<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習 - 教育支援キャラクター育成</title>
    <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/zukan.css">
</head>

<body class="app-with-footer">
    <header class="app-header">図鑑</header>
    <main class="main-content">
        <div class="card lunch-box-card">
            <div class="push-pin"></div>
            <div class="washi-tape tape-top-right"></div>

            <h2 class="menu-title">おにぎりシール手帳</h2>
            <p class="outline">これまでに出会ったおにぎりたちの中で、お気に入り登録された子たちがいます！タップしてその子のことをもっと知ろう！</p>

            <ul class="onigiri-grid" id="onigiri-grid" aria-live="polite">
                <li class="zukan-grid-loading" style="grid-column: 1 / -1; list-style: none; text-align: center; padding: 24px; color: #888;">
                    読み込み中…
                </li>
            </ul>

            <div class="pager-container">
        <button id="prev-page" class="pager-btn" disabled>
            <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <span id="page-number">—</span>
        <button id="next-page" class="pager-btn">
            <span class="material-symbols-outlined">chevron_right</span>
        </button>
    </div>

        </div>
        <div id="onigiri-modal" class="modal-overlay">
            <div class="modal-content binder-card">
                <button class="close-btn">&times;</button>

                <div class="modal-body">
                    <div class="modal-img-wrap">
                        <img id="modal-img" src="" alt="おにぎり">
                    </div>

                    <div class="modal-info">
                        <h3 id="modal-name">おにぎり名</h3>
                        <p id="modal-date" class="date-label">登録日: 2026/03/18</p>
                        <div class="description-box">
                            <p id="modal-description">〇〇をモチーフにしたかわいいおにぎり。</p>
                        </div>
                    </div>

                    <a id="download-btn" href="#" download class="download-button">
                        <span class="material-symbols-outlined">download</span>
                        ダウンロードする
                    </a>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer-nav"></footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/zukan.js"></script>
    <script>
        $(function () {
            if (!window.EduChar || !window.EduChar.ensureProfileThen) return;
            window.EduChar.ensureProfileThen("zukan.html").then(function () {
                if (typeof window.loadZukanFromFirebase === "function") {
                    window.loadZukanFromFirebase();
                }
            }).catch(function () {});
        });
    </script>
</body>

</html>
