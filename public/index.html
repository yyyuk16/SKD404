<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - 教育支援キャラ育成</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="app-with-footer">




  <header class="app-header">ホーム</header>
  <main class="main-content">
    <div class="card">
      <h2 class="messages  time-message" id="time-message">こんにちは！</h2>
      <div class="character-area">
        <div class="character-image" id="character-image">
          <span id="character-emoji">👤</span>
          <!-- ユーザーごとに一度だけ生成したキャラ画像を表示する img。
               初期状態では非表示にしておき、Gemini API から画像が返ってきたら JS で表示に切り替える。 -->
          <img id="character-img" alt="あなたのキャラクター" style="display:none;">
        </div>
        <!-- 画像のプロンプト -->
        <p class="character-description" id="character-description">読み込み中…</p>
        <!-- AIによって変更される、キャラクターからの今日のひとこと -->
        <p class="messages character-hitokoto">今日もがんばろう！</p>
      </div>
    </div>

    <!-- 日時表示 -->
    <div class="date-display-sticky">
      いまの時間 ↓<br>
        <span id="current-date-time">日時を読み込み中...</span>
    </div>

    <!-- リスト表示 -->
     <div menu-list>
      <!-- もくひょう -->
      <div class="card" id="goal">
        <h3>もくひょう</h3>
        <div class="hidden">
          <li id="goals">入力したもくひょうを反映<span id="goal-date">達成したい日付を反映</span></li>
        </div>
      </div>
      <!-- おしらせ -->
      <div class="card" id="alert">
        <h3>おしらせ</h3>
        <div class="hidden">
          <li id="alerts">近々大切なお知らせを表示<span id="alert-date">大事な予定のある日にちを反映</span></li>
        </div>
      </div>
      <!-- ショップ -->
      <div class="card" id="shop">
        <h3>ショップ</h3>
      </div>
     </div>
  </main>

  <!-- フッターメニュー -->
  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
