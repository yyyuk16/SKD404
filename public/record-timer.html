<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勉強時間を記録 - 教育支援キャラクター育成</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/record-timer.css">
</head>
<body class="app-with-footer">
  <header class="app-header">勉強時間を記録</header>
  
  <main class="main-content">
    <div style="margin-bottom: 12px; padding-left: 16px;">
      <button type="button" class="btn-back" onclick="location.href='record.html'">
        ← もどる
      </button>
    </div>

    <div class="card timer-card">
  <div class="push-pin"></div>

  <div class="mode-selector">
    <button type="button" id="mode-stopwatch" class="mode-btn active">ストップウォッチ</button>
    <button type="button" id="mode-timer" class="mode-btn">タイマー</button>
  </div>

  <div class="character-area">
    <div class="timer-circle-container">
      <div class="timer-circle">
        <h1 id="timer-display" class="timer-time">00:00</h1>

        <div id="timer-setting" class="timer-setting-ui" style="display: none;">
          <div class="timer-input-container">
            <div class="timer-input-group">
              <input type="text" id="input-minutes" class="pencil-input-sm" placeholder="0" inputmode="numeric">
              <span class="unit-label">分</span>
              <input type="text" id="input-seconds" class="pencil-input-sm" placeholder="0" inputmode="numeric">
              <span class="unit-label">秒</span>
            </div>
            <button id="save-current-timer" class="btn-save-preset">このタイマーを保存する</button>
          </div>
          <button id="open-preset-modal" class="btn-handwritten btn-primary-light">🍙 いつものタイマー</button>
        </div>

        <div id="preset-modal" class="inner-modal" style="display: none;">
          <div class="inner-modal-content">
            <p class="preset-title">いつものメニュー</p>
            <ul id="preset-ul" class="memo-list-sm">
              </ul>
            <button id="close-preset-modal" class="btn-back-sm">⬅ もどる</button>
          </div>
        </div>

        <p class="timer-message" id="timer-msg">はじめる準備はできた？</p>
        <div class="onigiri-nori"></div>
      </div>
    </div>

    <div class="form-group">
      <label for="timer-subject" id="input-title">なにをする？(科目・内容)</label>
      <input type="text" id="timer-subject" class="pencil-input" placeholder="例: 国語の音読">
    </div>

    <div class="timer-buttons">
      <button id="timer-start-btn" class="btn btn-primary btn-handwritten"><span>▶ はじめる</span></button>
      <button id="timer-stop-btn" class="btn btn-secondary btn-handwritten"><span>終了</span></button>
      <button id="timer-save-btn" class="btn btn-record btn-handwritten" style="display:none;"><span>登録する！</span></button>
    </div>
  </div>
</div>

    <div class="card history-card connecting-double-ropes">
  <div class="history-header">
    <h2 class="menu-title">これまでの記録</h2>
    <button id="toggle-history-btn" class="btn-handwritten toggle-btn">
      見る▽
    </button>
  </div>

  <div id="history-content" style="display: none;">
    <ul class="memo-list" id="timer-list">
      </ul>

    <div class="pagination-controls">
      <button id="prev-page" class="btn-handwritten page-btn">← 前のページ</button>
      <span id="page-number">1 / 1</span>
      <button id="next-page" class="btn-handwritten page-btn">次のページ →</button>
    </div>
  </div>
</div>
  </main>
  <footer id="footer-nav"></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/record-timer.js"></script>
</body>
</html>
